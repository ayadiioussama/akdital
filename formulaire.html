<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Akdital</title>
</head>
<body>
    <!-- Bare De Navigation -->
    <header class="header">
        <div class="logo">
            <a href="https://akdital.ma/" target="_blank" rel="noopener noreferrer">
                <img src="images/Logo1.png" alt="paysage" class="logo">
            </a>
        </div>
        <nav class="menu">
            <div>
                <a href="navigation.html">About Us</a>
                <a href="formulaire.html">Rendez-vous</a>
                <a href="contact.html">Contact Us</a>
            </div>
        </nav><br>
    </header>
    
    <!--section de forrmulaire -->
    <h2 class="txt_form">Prise Votre Rendez-vous</h2><br>
    <section id="inscription" class="section">
        <img src="images/rendez_vous.jpg" alt="paysage" class="img_content">
        <form class="form">
            <label>Nom Complet :</label> <br>
            <input type="text" placeholder="Entrer Votre Nom ... " required><br>
            <label>Email :</label><br>
            <input type="email" placeholder="Entrer Votre Email ... " required><br>
            <label for="type">Spécialisation: </label><br> 
            <select name="type" id="type">
                <option value="Oncologie">Oncologie</option>
                <option value="Cardiology">Cardiology</option>
                <option value="Gastro">Gastro-entérologie</option>
                <option value="Pédiatrie">Pédiatrie</option>
                <option value="Dermatologie">Dermatologie </option>
            </select><br>
            <label>Date Rendez-vous: </label><br>
            <input type="date" name="datetime" ><br>
            <label>Message: </label><br>
            <textarea cols="30" rows="10"></textarea>
            <br>
            <input type="submit" value="Envoyer">
        </form>   
    </section>
    <br>
    <a href="index.html"><button type="submit">Retour</button></a>

    <!--Section footer-->   
    <footer class="footer">
        _________________________________________________________________________________
        <p> AKDITAL International Medical Center</p>
        <p>© 2026 All Rights Reserved</p>
    </footer>
        
    
<br>
<br>
<br>

</body>
</html>
